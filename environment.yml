name: follow
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - opencv
  - cudatoolkit=11.8  # 建议显式指定，虽然pip会装nvidia库，但conda库能提供更好的系统兼容
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.2.2
      - torchvision==0.17.2
      - torchaudio==2.2.2
      - ultralytics==8.3.223
      - diffusers==0.25.0
      - transformers
      - accelerate
      - safetensors
      - opencv-python
      - numpy==1.24.4
      - pandas==1.5.2
      - matplotlib==3.8.4
      - scipy==1.15.3
      - scikit-learn==1.1.3
      - scikit-image==0.25.2
      - pillow==12.0.0
      - tqdm==4.67.1
      - pyyaml==6.0.2
      - wandb==0.22.2
      - einops==0.8.1
      - huggingface-hub==0.20.2
      - fastapi==0.109.0
      - pygame==2.6.1
      - pynput==1.8.1
      - djitellopy==2.5.0
      - gym==0.10.9
      - gym-unrealcv==2.0.2
      - tensorboard==2.20.0